  - "In `get_current_user`, parse `Authorization: Bearer <token>` (401 if missing/non-Bearer); in `require_roles(*allowed)`, return a dependency `def _guard(user: Annotated[AuthUser, Depends(get_current_user)]) -> AuthUser:` raising `HTTPException(403)` if `user.role not in allowed`."
