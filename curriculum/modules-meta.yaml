modules:
  - moduleId: "module-01"
    order: 1
    phase: 1
    title: "Module 1: Python Fundamentals"
    subtitle: "Types, Decimal precision, structural pattern matching, functions, I/O & domain exceptions"
    linkedinAngle:
      hook: "Why does `0.1 + 0.2 == 0.3` evaluate to `False` in Python—and why does `def add_tag(tag, tags=[])` silently corrupt data across requests?"
      pythonInsight: "Python 3.13 pairs dynamic ergonomics with strict precision tools when you need them: `Decimal('0.1')` eliminates IEEE-754 monetary drift, `match`/`case` replaces brittle `if`/`elif` chains, `tags: list[str] | None = None` prevents shared mutable defaults, and `raise ... from exc` preserves full exception causality."
      codeComparison: |
        # Trap: shared mutable default + binary float money
        def record_fee(amount: float, ledger: list[float] = []) -> list[float]:
            ledger.append(amount * 1.1)
            return ledger

        # Python 3.13 Production Idiom:
        from decimal import Decimal, ROUND_HALF_UP

        def record_fee(amount: Decimal, ledger: list[Decimal] | None = None) -> list[Decimal]:
            target = list(ledger) if ledger is not None else []
            fee = (amount * Decimal("1.10")).quantize(Decimal("0.01"), rounding=ROUND_HALF_UP)
            target.append(fee)
            return target
    bossLinkedinAngle:
      hook: "I built a deterministic Fee & Policy Evaluator Engine in pure Python 3.13—catching IEEE-754 rounding drift, mutable defaults, and swallowed exceptions."
      pythonInsight: "Combining `Decimal` + `ROUND_HALF_UP`, `match`/`case` policy routing with guard clauses, keyword-only override parameters (`*`), and chained custom domain exceptions (`raise PolicyEvaluationError(...) from exc`) turns fragile billing scripts into testable backend components."
      codeComparison: |
        match rule:
            case {"tier": "enterprise", "volume": vol} if vol >= 1000:
                rate = Decimal("0.0125")
            case {"tier": "standard"}:
                rate = Decimal("0.0290")
            case _:
                raise PolicyEvaluationError("Unsupported merchant policy")
    reflectionPrompts:
      - "Why does `Decimal(0.1)` still capture floating-point error compared to `Decimal('0.1')`?"
      - "When does a default mutable argument get evaluated in Python, and why is `None` + local initialization mandatory?"

  - moduleId: "module-02"
    order: 2
    phase: 1
    title: "Module 2: Data Structures & Core Algorithms"
    subtitle: "Slicing, O(1) sets/dicts, deque sliding windows, Counter/heapq & BST recursion"
    linkedinAngle:
      hook: "Using `list.pop(0)` inside a log processor turns an O(N) stream into an O(N^2) CPU bottleneck—`collections.deque` fixes it in one import."
      pythonInsight: "Choosing the right built-in or `collections` container dominates Python backend performance: `set` membership is O(1) vs `list` O(N), `deque` gives O(1) head/tail evictions, `Counter` and `defaultdict` eliminate defensive boilerplate, and `heapq` keeps top-K tracking in O(N log K)."
      codeComparison: |
        # Before: O(N) front pop + manual dict initialization
        window.pop(0)
        counts[code] = counts.get(code, 0) + 1

        # After: O(1) deque eviction + Counter / heapq
        from collections import Counter, deque
        window: deque[tuple[int, str]] = deque()
        window.popleft()
        counts = Counter(codes)
    bossLinkedinAngle:
      hook: "Built a Sliding-Window Log Stream & Top-K Anomaly Tracker using `deque`, `Counter`, and `heapq`—with zero O(N^2) list shifts."
      pythonInsight: "In the Module 2 Boss Fight, evicting expired timestamps from the left of a `deque` in amortized O(1), parsing raw log lines safely with `split('=', 1)`, and ranking hottest failing services with `heapq.nsmallest` using negated counts + alphabetical tie-breakers keeps throughput predictable."
      codeComparison: |
        while window and window[0][0] < cutoff_ts:
            _, expired_service, is_err = window.popleft()
            if is_err:
                error_counts[expired_service] -= 1
                if error_counts[expired_service] <= 0:
                    del error_counts[expired_service]
    reflectionPrompts:
      - "Why is checking `item in seen_set` dramatically faster than `item in seen_list` as N grows?"
      - "How do you guarantee deterministic tie-breaking in `heapq` when two items share the same priority?"

  - moduleId: "module-03"
    order: 3
    phase: 1
    title: "Module 3: Object-Oriented Programming"
    subtitle: "Dataclasses, composition, @property invariants, typing.Protocol & dunder methods"
    linkedinAngle:
      hook: "Why use `typing.Protocol` instead of `abc.ABC` in Python 3.13—and why does defining `__eq__` without `__hash__` break your sets and dicts?"
      pythonInsight: "Python OOP prioritizes structural contracts (`Protocol`), immutable `@dataclass(frozen=True)` value objects with `__post_init__` guards, `@property` invariant validation, and composition over deep inheritance hierarchies."
      codeComparison: |
        # Before: nominal ABC forcing inheritance on every test double
        class MetricsSink(ABC):
            @abstractmethod
            def emit(self, name: str, value: int) -> None: ...

        # Pythonic Structural Protocol:
        class MetricsSink(Protocol):
            def emit(self, name: str, value: int) -> None: ...
    bossLinkedinAngle:
      hook: "I architected an extensible Limit Order Book in pure Python 3.13—swapping Price-Time and Immediate-Or-Cancel matching with zero `OrderBook` rewrites."
      pythonInsight: "Combining frozen `@dataclass` orders, `__len__`/`__iter__` container dunders, and a `MatchingStrategy(Protocol)` isolates matching rules from order-book state and makes partial fills deterministic."
      codeComparison: |
        class OrderBook:
            def __init__(self, strategy: MatchingStrategy | None = None) -> None:
                self._strategy = strategy or PriceTimeStrategy()
                self._resting: list[Order] = []

            def submit(self, order: Order) -> list[TradeFill]:
                fills, next_resting, remainder = self._strategy.match(order, self._resting)
                if remainder is not None:
                    next_resting.append(remainder)
                self._resting = next_resting
                return fills
    reflectionPrompts:
      - "Why does defining `__eq__` on a custom class automatically set `__hash__ = None` unless you define `__hash__`?"
      - "When is `typing.Protocol` a better fit than `abc.ABC` for decoupling storage or pricing strategies?"

  - moduleId: "module-04"
    order: 4
    phase: 1
    title: "Module 4: Advanced Python"
    subtitle: "Decorators, lazy generators, context managers, closures, regex & atomic file writes"
    linkedinAngle:
      hook: "Reading a 4 GB production log with `.readlines()` crashes workers with OOM. Replacing `[...]` with `yield` keeps memory flat at O(1)."
      pythonInsight: "Python's iterator protocol, `@contextmanager` cleanup guarantees, `@functools.wraps` parameterized decorators, `re.compile` named groups, and `tempfile.mkstemp` + `os.replace` atomic writes solve real production failure modes cleanly."
      codeComparison: |
        # Trap: loads whole file into RAM + non-atomic partial write
        lines = src.read_text().splitlines()
        target.write_text(summary)

        # Production Python: lazy generator + atomic os.replace
        with src.open("r", encoding="utf-8") as fh:
            for line, counts in iter_redacted_lines(fh):
                out_fh.write(line)
        os.replace(tmp_path, target)
    bossLinkedinAngle:
      hook: "Built a Streaming PII Log Redactor in Python 3.13 that scrubs emails, CPFs, and Bearer JWTs in O(1) memory with atomic JSON stats."
      pythonInsight: "Pairing compiled `re.Pattern.subn()` rules with a lazy `yield` generator pipeline and `os.replace` atomic writes guarantees zero half-written audit files and constant memory usage on unbounded streams."
      codeComparison: |
        def iter_redacted_lines(lines: Iterable[str]) -> Iterator[tuple[str, dict[str, int]]]:
            for line in lines:
                yield redact_line(line)
    reflectionPrompts:
      - "Why must a temporary file live in the same directory as the destination before calling `os.replace(tmp, target)`?"
      - "What breaks in a closure loop `[lambda: i for i in range(3)]`, and how does `functools.partial` fix it?"

  - moduleId: "module-05"
    order: 5
    phase: 1
    title: "Module 5: Libraries & Frameworks Base"
    subtitle: "NumPy vectorization, Pandas groupby, headless Agg charts, Flask, requests & BeautifulSoup"
    linkedinAngle:
      hook: "Calling `requests.get(url)` without `timeout=` can hang a backend worker forever—and `plt.show()` crashes in Docker without `Agg`."
      pythonInsight: "Mastering Python's core ecosystem requires defensive defaults: NumPy boolean masks with zero-range guards, `pd.to_numeric(..., errors='coerce')`, headless `matplotlib.use('Agg')` + `plt.close(fig)`, modular Flask Blueprints, and `requests.Session` timeouts."
      codeComparison: |
        # Fragile script: no timeout, leaks open figures
        data = requests.get(url).json()
        plt.bar(x, y)

        # Production-safe headless pipeline:
        matplotlib.use("Agg")
        with requests.Session() as session:
            resp = session.get(url, timeout=2.0)
            resp.raise_for_status()
        fig, ax = plt.subplots()
        try:
            sns.barplot(x=x, y=y, ax=ax)
            fig.savefig(out_path)
        finally:
            plt.close(fig)
    bossLinkedinAngle:
      hook: "Built an offline-tested Automated Web Report Collector: `requests` → `BeautifulSoup` → `Pandas` groupby → headless `Agg` PNG + Markdown digest."
      pythonInsight: "Testing `requests` + `BeautifulSoup` against an ephemeral `ThreadingHTTPServer` on `127.0.0.1:0` and rendering charts with `Agg` + `plt.close(fig)` keeps integration suites deterministic, leak-free, and 100% offline."
      codeComparison: |
        summary = (
            df.groupby("region", as_index=False)
            .agg(avg_latency_ms=("latency_ms", "mean"), service_count=("service", "count"))
            .sort_values(by=["avg_latency_ms", "region"], ascending=[False, True])
        )
    reflectionPrompts:
      - "When would you choose Flask (micro-framework + Blueprints) vs. Django (MTV + built-in ORM/Admin) for a new backend service?"
      - "Why should every `matplotlib` figure created in a server or test suite be closed inside a `finally:` block?"

  - moduleId: "module-06"
    order: 6
    phase: 2
    title: "Module 6: Complex Project Architecture, Typing & pytest"
    subtitle: "Unidirectional src/ layering, pydantic-settings, Pydantic v2 discriminated unions & test doubles"
    linkedinAngle:
      hook: "Circular imports in Python aren't a language bug—they're an architecture smell telling you your domain layer depends on your service layer."
      pythonInsight: "Using a `src/` layout with `uv` + `pyproject.toml`, unidirectional imports (`domain` ← `ports` ← `service`), `TYPE_CHECKING` guards, `pydantic-settings` (`SecretStr`), and Pydantic v2 discriminated unions keeps large Python backends statically verifiable and modular."
      codeComparison: |
        # Before: domain.py imports service.py -> ImportError cycle!
        # After: unidirectional dependency inversion via Protocol + TYPE_CHECKING
        from __future__ import annotations
        from typing import TYPE_CHECKING, Protocol

        if TYPE_CHECKING:
            from domain import Receipt

        class ReceiptRepoPort(Protocol):
            def save(self, receipt: Receipt) -> None: ...
    bossLinkedinAngle:
      hook: "I architected a 4-module hexagonal Billing Core in Python 3.13—combining `pydantic-settings`, Pydantic v2 discriminated unions, `Protocol` ports, and pure in-memory test doubles."
      pythonInsight: "Validating commands via `TypeAdapter(ChargeCommand)`, masking secrets with `SecretStr`, and testing against `StubGateway`/`FakeReceiptRepo` Protocols delivers fast deterministic tests with zero `unittest.mock.patch` coupling."
      codeComparison: |
        ChargeCommand = Annotated[
            SubscriptionCharge | UsageCharge,
            Field(discriminator="kind"),
        ]
        cmd = TypeAdapter(ChargeCommand).validate_python(raw_command)
    reflectionPrompts:
      - "Why does testing with `Protocol`-backed Fake/Spy doubles scale better than patching internal imports with `unittest.mock.patch`?"
      - "How does `Annotated[Union[...], Field(discriminator='kind')]` improve Pydantic v2 validation speed and error clarity?"

  - moduleId: "module-07"
    order: 7
    phase: 2
    title: "Module 7: CPython Internals, Concurrency & asyncio"
    subtitle: "GIL, tracemalloc/cProfile, ThreadPool vs ProcessPool, TaskGroup & httpx backpressure"
    linkedinAngle:
      hook: "Spawning 50 threads for CPU-bound hashing won't speed up CPython because of the GIL—and spawning 5,000 unbounded `asyncio` HTTP tasks will crash your gateway."
      pythonInsight: "CPython's GIL releases during I/O (`ThreadPoolExecutor` / `asyncio`) but requires `ProcessPoolExecutor` with top-level picklable workers for CPU-bound Python code, while `asyncio.TaskGroup`, `asyncio.timeout`, and `asyncio.Semaphore` prevent task leaks and overload."
      codeComparison: |
        # Before: unbounded gather() + no timeout
        await asyncio.gather(*(client.get(u) for u in urls))

        # Structured Concurrency + Backpressure:
        async with sem, asyncio.timeout(0.5):
            resp = await client.get(url)
    bossLinkedinAngle:
      hook: "Built a Resilient Async Health Aggregator with `asyncio.TaskGroup`, `asyncio.Semaphore`, per-probe `asyncio.timeout`, and deterministic `httpx.MockTransport` tests."
      pythonInsight: "Isolating per-probe timeouts and `503` retries inside `ProbeClient` while orchestrating fan-out in `HealthAggregator` keeps one slow upstream from stalling the cluster health rollup."
      codeComparison: |
        async with self._sem:
            async with asyncio.timeout(self.per_probe_timeout):
                resp = await self.client.get(url)
    reflectionPrompts:
      - "When should you reach for `ThreadPoolExecutor`, `ProcessPoolExecutor`, or `asyncio` in CPython?"
      - "Why must functions passed to `ProcessPoolExecutor.map` be defined at module top level instead of local lambdas?"

  - moduleId: "module-08"
    order: 8
    phase: 3
    title: "Module 8: Raw SQL Engineering"
    subtitle: "CTEs, NOT EXISTS, composite indexes + EXPLAIN, keyset cursors & optimistic locking"
    linkedinAngle:
      hook: "Why does `WHERE id NOT IN (SELECT user_id FROM refunds)` return ZERO rows when a single row has `NULL`, and why does `OFFSET 10000` duplicate items under live inserts?"
      pythonInsight: "Production SQL discipline replaces `NOT IN` with `NULL`-safe `NOT EXISTS`, orders composite B-tree indexes `(equality_cols, sort_col)` verified by `EXPLAIN QUERY PLAN`, uses `(created_at, id)` keyset cursors, and enforces `WHERE version = ?` optimistic locks."
      codeComparison: |
        -- Before: full scan + OFFSET drift + lost updates
        SELECT * FROM feed_events ORDER BY created_at DESC LIMIT 20 OFFSET 5000;

        -- Keyset Cursor Pagination + Index Seek:
        SELECT id, title, created_at FROM feed_events
        WHERE (created_at < ?) OR (created_at = ? AND id < ?)
        ORDER BY created_at DESC, id DESC LIMIT 21;
    bossLinkedinAngle:
      hook: "Built an ACID Multi-SKU Inventory Reservation Engine in raw SQL—preventing oversell with `BEGIN IMMEDIATE`, optimistic `version` checks, and full rollback on partial SKU failure."
      pythonInsight: "Checking `cursor.rowcount == 1` on `UPDATE skus SET stock = stock - ?, version = version + 1 WHERE sku = ? AND version = ? AND stock >= ?` inside a single `BEGIN IMMEDIATE` transaction guarantees zero partial decrements."
      codeComparison: |
        UPDATE skus
        SET stock = stock - ?, version = version + 1
        WHERE sku = ? AND version = ? AND stock >= ?;
    reflectionPrompts:
      - "Why does `NOT IN` fail silently when a subquery returns `NULL`, whereas `NOT EXISTS` handles `NULL` safely?"
      - "How does PostgreSQL's `SELECT ... FOR UPDATE SKIP LOCKED` solve concurrent job-queue polling compared to SQLite's `BEGIN IMMEDIATE`?"

  - moduleId: "module-09"
    order: 9
    phase: 3
    title: "Module 9: SQLAlchemy 2.0, Sessions, Zero-N+1 & Alembic"
    subtitle: "DeclarativeBase Mapped types, Unit of Work DTO boundaries, selectinload, savepoints & Alembic"
    linkedinAngle:
      hook: "Fetching 25 orders and reading `order.items` inside a loop quietly fires 26+ SQL queries. One `selectinload` option collapses that N+1 storm down to 2."
      pythonInsight: "SQLAlchemy 2.0 pairs strict type-checked `Mapped[...]` / `mapped_column(...)` models with `selectinload`/`joinedload` eager loading, `begin_nested()` savepoints, `version_id_col` optimistic locks, Pydantic DTO mapping before `Session` close, and reversible Alembic migrations."
      codeComparison: |
        # Trap: lazy N+1 storm + detached ORM leak
        orders = session.scalars(select(Order)).all()

        # SQLAlchemy 2.0 Zero-N+1 + Pydantic DTO Boundary:
        stmt = select(Order).options(joinedload(Order.buyer), selectinload(Order.lines))
        orders = session.scalars(stmt).unique().all()
        return [OrderDTO.model_validate(o) for o in orders]
    bossLinkedinAngle:
      hook: "I built a Zero-N+1 Order Repository in SQLAlchemy 2.0—enforced by an automated SQL query-count listener and `version_id_col` optimistic locking."
      pythonInsight: "Attaching an engine `before_cursor_execute` assertion in `pytest` proves `list_orders_dto` executes <= 2 SQL queries for 25+ orders, while catching `StaleDataError` prevents lost stock updates."
      codeComparison: |
        class Product(Base):
            __tablename__ = "products"
            id: Mapped[int] = mapped_column(primary_key=True)
            stock: Mapped[int]
            version: Mapped[int] = mapped_column(nullable=False, default=1)
            __mapper_args__ = {"version_id_col": version}
    reflectionPrompts:
      - "Why should ORM instances always be mapped into Pydantic DTOs before exiting the `Session` context manager?"
      - "When is `selectinload` preferred over `joinedload` in SQLAlchemy 2.0?"

  - moduleId: "module-10"
    order: 10
    phase: 4
    title: "Module 10: FastAPI as a Production System"
    subtitle: "Depends() DI, RFC 7807 ProblemDetail, PyJWT + RBAC (401 vs 403) & contextvars observability"
    linkedinAngle:
      hook: "Returning `403 Forbidden` for a missing JWT or leaking `contextvars` across async requests breaks API contracts and audit logs—here is the FastAPI fix."
      pythonInsight: "Production FastAPI layers `api -> service -> domain -> repo` with `Depends()`, standardizes every failure as RFC 7807 `application/problem+json`, separates `401` JWT auth from `403` RBAC, and resets `contextvars.ContextVar` request IDs in `finally:`."
      codeComparison: |
        # Safe async correlation middleware:
        token = REQUEST_ID_CTX.set(req_id)
        try:
            response = await call_next(request)
            response.headers["X-Request-ID"] = req_id
            return response
        finally:
            REQUEST_ID_CTX.reset(token)
    bossLinkedinAngle:
      hook: "Built a Hardened Admin Gateway API in FastAPI: PyJWT + RBAC, RFC 7807 `ProblemDetail` errors, `X-Request-ID` propagation, and structured audit logs."
      pythonInsight: "Routing auth (`401`) and RBAC (`403`) exceptions through a unified RFC 7807 `@app.exception_handler` attaches the active `REQUEST_ID_CTX` trace ID to every success and failure response."
      codeComparison: |
        @app.post("/admin/policies", status_code=201)
        def create_policy(
            body: PolicyCreate,
            actor: Annotated[AuthUser, Depends(require_roles("admin"))],
        ) -> dict[str, object]: ...
    reflectionPrompts:
      - "What is the exact semantic difference between HTTP `401 Unauthorized` and `403 Forbidden`?"
      - "Why is `contextvars.ContextVar` safe for `asyncio` request tracing whereas `threading.local` breaks?"
