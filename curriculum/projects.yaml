projects:
  - id: "proj-01-cli-ledger-reconciler"
    order: 1
    title: "CLI Financial Ledger Reconciler"
    milestoneLabel: "Gate #1 // After Module 5 (Block 1 Foundations Capstone)"
    requiredModulesCompleted: 5
    prerequisiteModuleIds:
      - "module-01"
      - "module-02"
      - "module-03"
      - "module-04"
      - "module-05"
    techStack:
      - "Python 3.13"
      - "uv"
      - "Decimal & Dataclasses"
      - "Pandas / CSV"
      - "pytest & Ruff"
      - "GitHub Actions CI"
    businessContext: |
      Payment engineering teams reconcile internal gateway exports against acquiring bank settlement
      CSVs every night. A single $0.01 IEEE-754 float rounding bug, half-written report, or missed
      refund silently breaks financial audits. Build a deterministic CLI reconciler in pure Python 3.13
      + `uv` that streams both CSV ledgers with `Decimal` arithmetic, isolates exact matches, cent-level
      amount mismatches, and orphan entries, writes an atomic JSON/Markdown audit report (plus an
      optional headless `Agg` discrepancy chart), and verifies everything with `pytest`, `ruff`, and
      GitHub Actions CI.
    packageLayout: |
      cli-ledger-reconciler/
      ├── .github/workflows/ci.yml        # Runs `uv run ruff check .` and `uv run pytest`
      ├── pyproject.toml                  # Python 3.13 + uv dependencies (pytest, ruff, pandas, matplotlib)
      ├── fixtures/
      │   ├── gateway_export.csv          # Realistic transactions with exact + drifted cents
      │   └── bank_settlement.csv         # Missing rows, fee variance, duplicate IDs
      ├── src/reconciler/
      │   ├── __init__.py
      │   ├── cli.py                      # argparse entrypoint & exit-code handling
      │   ├── models.py                   # @dataclass(frozen=True) LedgerEntry, DiscrepancyKind, AuditSummary
      │   ├── parser.py                   # Streaming csv.DictReader + Decimal parsing & validation
      │   ├── engine.py                   # Pure reconciliation engine + set/dict O(1) matching
      │   └── report.py                   # Atomic os.replace JSON/Markdown report + Agg chart
      └── tests/
          ├── test_parser.py
          └── test_reconciler.py          # Exactness (0.10 + 0.20 == 0.30), duplicates, orphans, atomic output
    sprints:
      - id: "sprint-1"
        title: "Sprint 1: uv Package Layout & GitHub Actions CI"
        items:
          - id: "s1-1"
            text: "Bootstrap a `src/` layout repository with `pyproject.toml`, `uv`, `ruff`, `pytest`, and realistic `gateway_export.csv` / `bank_settlement.csv` fixtures."
          - id: "s1-2"
            text: "Add `.github/workflows/ci.yml` using `astral-sh/setup-uv@v5` on Python 3.13 to run `uv run ruff check .` and `uv run pytest` on every push and PR."
      - id: "sprint-2"
        title: "Sprint 2: Exact Decimal Models & Streaming CSV Parser"
        items:
          - id: "s2-1"
            text: "Model immutable `@dataclass(frozen=True)` `LedgerEntry` records parsing amounts exclusively via `Decimal(str_val)` (`ROUND_HALF_UP`) with zero `float` usage."
          - id: "s2-2"
            text: "Stream CSV rows with `csv.DictReader`, rejecting blank IDs, malformed decimals, or duplicate transaction IDs with custom domain exceptions (`raise ... from exc`)."
      - id: "sprint-3"
        title: "Sprint 3: Reconciliation Engine & Atomic Reporting"
        items:
          - id: "s3-1"
            text: "Reconcile ledgers in O(N) using dicts/sets into `EXACT_MATCH`, `AMOUNT_MISMATCH` (signed cent variance), `GATEWAY_ONLY`, and `BANK_ONLY`."
          - id: "s3-2"
            text: "Emit an atomic Markdown + JSON audit report (`tempfile.mkstemp` + `os.replace`) and an optional headless `Agg` PNG summary chart."
      - id: "sprint-4"
        title: "Sprint 4: CLI Polish, Edge-Case Tests & Showcase"
        items:
          - id: "s4-1"
            text: "Write `pytest` tests verifying `Decimal('0.10') + Decimal('0.20') == Decimal('0.30')`, empty CSVs, duplicate IDs, and atomic cleanup."
          - id: "s4-2"
            text: "Publish a concise README showing sample CLI discrepancy output and a passing GitHub Actions badge."
    reviewCriteria:
      - "Monetary exactness: zero `float` values anywhere in price, fee, or variance paths; uses `Decimal` constructed from strings."
      - "Clean architecture: CSV I/O and `argparse` stay outside `engine.py`, making core reconciliation 100% pure and fast to unit-test."
      - "Safety invariants: atomic temp-file + `os.replace` writes for outputs; headless `Agg` backend + `plt.close(fig)` if rendering charts."
      - "CI hygiene: `uv run ruff check .` and `uv run pytest` pass cleanly on a fresh checkout."
    showcaseTips:
      - "Put a real terminal discrepancy table (`Gateway vs Bank vs Variance`) at the top of your README."
      - "LinkedIn angle: 'Why 0.1 + 0.2 != 0.3 in Python—and how I built a zero-float CLI financial ledger reconciler with Decimal, dataclasses, and atomic writes.'"
    aiReviewPrompts:
      - "Review my `src/reconciler/` modules (`models.py`, `parser.py`, `engine.py`, `report.py`) for floating-point leaks, mutable default traps, non-atomic file writes, and duplicated validation. List risks first before suggesting edits."
      - "Critique my `pytest` suite for `CLI Financial Ledger Reconciler`: what boundary cases (empty CSVs, duplicate IDs across both ledgers, $0.01 rounding drift, malformed decimal strings, negative refunds) am I missing?"

  - id: "proj-02-inventory-audit-service"
    order: 2
    title: "High-Concurrency Inventory & Audit Service"
    milestoneLabel: "Gate #2 // After Module 9 (SQL & ORM Engineering Capstone)"
    requiredModulesCompleted: 9
    prerequisiteModuleIds:
      - "module-01"
      - "module-02"
      - "module-03"
      - "module-04"
      - "module-05"
      - "module-06"
      - "module-07"
      - "module-08"
      - "module-09"
    techStack:
      - "Python 3.13"
      - "PostgreSQL 16"
      - "SQLAlchemy 2.0"
      - "Alembic"
      - "FastAPI"
      - "Docker Compose"
    businessContext: |
      Flash-sale inventory checkouts fail catastrophically when concurrent requests read stale stock
      counts and oversell SKUs—or when order listings trigger N+1 SQL storms under load. Build a
      production-grade Inventory & Audit microservice backed by PostgreSQL 16 (via Docker Compose),
      SQLAlchemy 2.0 (`Mapped`/`mapped_column`, `selectinload` zero-N+1 queries, `version_id_col`
      optimistic locking), reversible Alembic migrations, and FastAPI endpoints—verified with
      concurrency tests proving zero oversell and strict query-count budgets.
    packageLayout: |
      inventory-audit-service/
      ├── .github/workflows/ci.yml        # Spins up Postgres 16 service, runs alembic upgrade + pytest
      ├── docker-compose.yml              # FastAPI app + PostgreSQL 16 with healthcheck
      ├── pyproject.toml                  # Python 3.13 + uv (fastapi, sqlalchemy, alembic, psycopg)
      ├── alembic.ini
      ├── migrations/
      │   ├── env.py
      │   └── versions/
      │       ├── 0001_initial_inventory.py
      │       └── 0002_add_audit_indexes.py
      ├── src/inventory/
      │   ├── config.py                   # pydantic-settings DATABASE_URL + pool config
      │   ├── models.py                   # DeclarativeBase Sku, Reservation, AuditEntry (version_id_col)
      │   ├── schemas.py                  # Pydantic v2 DTOs (no detached ORM leakage)
      │   ├── repository.py               # Zero-N+1 selectinload + optimistic lock stock decrement
      │   └── app.py                      # FastAPI endpoints + RFC 7807 conflict handlers
      └── tests/
          ├── test_migrations.py          # alembic upgrade head -> downgrade base roundtrip
          ├── test_zero_n1.py             # before_cursor_execute query-count <= 2 assertions
          └── test_concurrency.py         # Concurrent reservation barrier proving zero oversell
    sprints:
      - id: "sprint-1"
        title: "Sprint 1: Docker Compose PostgreSQL 16 & Alembic Baseline"
        items:
          - id: "s1-1"
            text: "Configure `docker-compose.yml` with PostgreSQL 16 + healthcheck and `pydantic-settings` `DATABASE_URL`."
          - id: "s1-2"
            text: "Create reversible Alembic migrations (`0001_initial_inventory`, `0002_add_audit_indexes`) verified with `upgrade`/`downgrade` tests."
      - id: "sprint-2"
        title: "Sprint 2: SQLAlchemy 2.0 Domain, Zero-N+1 & Optimistic Locking"
        items:
          - id: "s2-1"
            text: "Define `Sku` (`version_id_col`), `Reservation`, and `AuditEntry` using SQLAlchemy 2.0 `Mapped`/`mapped_column` only."
          - id: "s2-2"
            text: "Implement `list_reservations_dto` with `selectinload` (`<= 2` SQL queries enforced by `before_cursor_execute`) and `begin_nested()` savepoint audit logging."
      - id: "sprint-3"
        title: "Sprint 3: FastAPI Endpoints & Concurrency Verification"
        items:
          - id: "s3-1"
            text: "Expose `POST /reservations`, `GET /reservations` (keyset cursor pagination), and map `StaleDataError` / stock shortages to HTTP `409 Conflict` RFC 7807 responses."
          - id: "s3-2"
            text: "Run a multi-threaded / async concurrent checkout test against PostgreSQL proving 0 negative stock and deterministic conflict handling."
    reviewCriteria:
      - "Zero legacy SQLAlchemy 1.x `session.query()` or untyped `Column(...)` usage."
      - "Hard SQL query budget asserted in tests via `before_cursor_execute` (`<= 2` queries on list endpoints)."
      - "No ORM objects returned past repository/service boundaries; every API response uses Pydantic v2 DTOs."
      - "Concurrent barrier test proves zero oversell under optimistic locking or `SELECT ... FOR UPDATE`."
    showcaseTips:
      - "Share a `before_cursor_execute` query-count before/after benchmark in your README."
      - "LinkedIn angle: 'How I proved zero-N+1 queries and zero oversell in a FastAPI + SQLAlchemy 2.0 + PostgreSQL 16 service.'"
    aiReviewPrompts:
      - "Audit my SQLAlchemy 2.0 `models.py` and `repository.py` for detached ORM leaks, hidden N+1 relationship accesses, missing savepoint handling, and optimistic lock edge cases. List risks before rewriting."
      - "Review my Alembic migrations and concurrency test suite: do my `downgrade()` steps cleanly reverse every index/column, and does my concurrent reservation test genuinely trigger contention?"

  - id: "proj-03-mini-sidekiq-ai-triage"
    order: 3
    title: "Mini-Sidekiq Distributed Job Engine + AI Triage"
    milestoneLabel: "After Module 12 (Graduation Capstone)"
    requiredModulesCompleted: 12
    prerequisiteModuleIds:
      - "module-10"
      - "module-11"
      - "module-12"
    techStack:
      - "Python 3.13"
      - "FastAPI"
      - "PostgreSQL 16"
      - "Alembic"
      - "Testcontainers"
      - "RAG + LLM Evals"
      - "GitHub Actions"
      - "AWS (RDS / SQS / S3 / ECS)"
    businessContext: |
      Build a capstone distributed background-job platform ("Mini-Sidekiq") as a clean modular
      monolith with FastAPI, PostgreSQL 16, Alembic, and Testcontainers. Accept job submissions
      protected by SHA-256 `Idempotency-Key` deduplication, persist domain records + outbox jobs in
      single ACID transactions, dispatch webhooks behind an injectable-clock Circuit Breaker with
      exponential backoff + Dead-Letter Queue (DLQ), and embed an AI RAG Triage Assistant (with PII
      scrubbing, prompt-injection guardrails, Pydantic v2 structured output repair, and eval suite)
      that summarizes DLQ failures citing your architectural runbooks.

      AWS Production Mapping:
      - PostgreSQL 16 -> Amazon RDS (Multi-AZ PostgreSQL)
      - Webhook / Outbox Queue + DLQ -> Amazon SQS + SQS Dead-Letter Queue
      - Audit & Report Artifacts -> Amazon S3 (scoped bucket prefix + lifecycle rules)
      - FastAPI API + Celery/Relay Workers -> Amazon ECS Fargate / AWS App Runner
      - Credentials & Signing Keys -> AWS Secrets Manager (zero plaintext secrets in task defs)
    packageLayout: |
      mini-sidekiq-ai-triage/
      ├── .github/workflows/ci.yml        # ruff, pytest + Testcontainers Postgres, multi-stage Docker build
      ├── docs/adr/
      │   ├── 0001-transactional-outbox.md
      │   ├── 0002-rag-triage-guardrails.md
      │   └── 0003-local-vs-aws-parity.md # LocalStack/MinIO & Protocol ports vs RDS/SQS/S3/ECS
      ├── docker-compose.yml              # FastAPI API + worker container + PostgreSQL 16
      ├── Dockerfile                      # Multi-stage non-root uv runtime with HEALTHCHECK + SIGTERM
      ├── pyproject.toml
      ├── src/sidekiq_py/
      │   ├── api/app.py                  # FastAPI + PyJWT RBAC + RFC 7807 + X-Request-ID contextvars
      │   ├── persistence/outbox.py       # SQLAlchemy 2.0 Outbox, Idempotency & DLQ repositories
      │   ├── worker/relay.py             # CircuitBreaker, bounded backoff & graceful SIGTERM loop
      │   └── triage/                     # Hybrid RAG runbook indexer, PII scrub, Pydantic repair + evals
      └── tests/
          ├── test_outbox_testcontainers.py
          ├── test_resilience_breaker_dlq.py
          └── test_ai_triage_evals.py
    sprints:
      - id: "sprint-1"
        title: "Sprint 1: Hardened FastAPI Gateway & Transactional Outbox"
        items:
          - id: "s1-1"
            text: "Stand up FastAPI API with PyJWT RBAC (`401` vs `403`), RFC 7807 errors, `X-Request-ID` middleware, and SHA-256 `Idempotency-Key` job ingestion."
          - id: "s1-2"
            text: "Persist job + `outbox_events` in PostgreSQL 16 (RDS-ready connection pooling) via SQLAlchemy 2.0 + Alembic, verified against Testcontainers."
      - id: "sprint-2"
        title: "Sprint 2: Circuit Breaker Relay, Backoff, Containers & AWS Parity"
        items:
          - id: "s2-1"
            text: "Implement worker relay with `CLOSED -> OPEN -> HALF_OPEN` Circuit Breaker, capped exponential backoff, and DLQ quarantine (clean `QueuePort`/`BlobStore` abstractions swappable to Amazon SQS + SQS DLQ & S3)."
          - id: "s2-2"
            text: "Package multi-stage non-root `Dockerfile` (ECS Fargate / App Runner ready), `HEALTHCHECK`, graceful `SIGTERM` drain, Secrets Manager env mapping, and 3 ADRs under `docs/adr/` (including LocalStack/MinIO local-vs-AWS parity)."
      - id: "sprint-3"
        title: "Sprint 3: AI DLQ Triage Assistant & Automated Evals"
        items:
          - id: "s3-1"
            text: "Index incident runbooks into a hybrid RAG store; scrub PII/tokens before LLM calls and validate structured `TriageReport` outputs with Pydantic v2 repair retries."
          - id: "s3-2"
            text: "Write a GitHub Actions CI pipeline running `ruff`, Testcontainers integration tests, and automated AI evals (`pass_rate`, `p95_latency_ms`, USD cost)."
    reviewCriteria:
      - "Circuit Breaker fast-fails do NOT consume job retry attempts before DLQ quarantine."
      - "Docker runtime runs as non-root user with multi-stage `uv sync --no-dev` and `SIGTERM` graceful stop (ECS Fargate / App Runner compatible)."
      - "Storage/queue ports isolate infrastructure so local Docker/MinIO/LocalStack swaps cleanly to Amazon RDS, SQS (+ SQS DLQ), S3, and Secrets Manager with least-privilege IAM."
      - "RAG triage assistant refuses prompt-injection attempts and cites only retrieved runbook chunks."
      - "CI workflow passes lint, unit, Testcontainers Postgres, and offline AI eval checks green."
    showcaseTips:
      - "Record a 90-second demo triggering a downstream 503 outage -> breaker OPEN -> DLQ -> AI Triage citation summary."
      - "Include an architecture diagram mapping local Docker services (`Postgres`, `Outbox/Redis`, `MinIO/LocalStack`) to AWS (`RDS`, `SQS + DLQ`, `S3`, `ECS Fargate`, `Secrets Manager`)."
    aiReviewPrompts:
      - "Perform a Staff Engineer production-readiness audit of my `sidekiq_py` outbox relay, Circuit Breaker state transitions, Docker hardening, and `SIGTERM` shutdown loop. Highlight any race conditions or silent failure modes."
      - "Audit my AWS Production Deployment architecture (`RDS`, `SQS + SQS DLQ`, `S3`, `ECS Fargate`, `Secrets Manager`) and `0003-local-vs-aws-parity.md` ADR for IAM least-privilege gaps, queue visibility-timeout vs. `acks_late` mismatches, and zero-secret container config."
      - "Red-team my `triage/` RAG pipeline for PII leaks, indirect prompt injections inside DLQ error messages, fabricated citations, and unbounded LLM retry costs."
